<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1a1f"/>
  
  <!-- Mystical smoke/fog effect -->
  <defs>
    <!-- Gradient for the magic ball -->
    <radialGradient id="ballGradient" cx="30%" cy="30%">
      <stop offset="0%" stop-color="#2a2a35"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    
    <!-- Smoke/fog gradient -->
    <radialGradient id="smokeGradient" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.1"/>
    </radialGradient>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Mystical smoke clouds around the ball -->
  <ellipse cx="400" cy="200" rx="150" ry="100" fill="url(#smokeGradient)" opacity="0.4"/>
  <ellipse cx="800" cy="250" rx="120" ry="80" fill="url(#smokeGradient)" opacity="0.3"/>
  <ellipse cx="500" cy="450" rx="130" ry="90" fill="url(#smokeGradient)" opacity="0.35"/>
  <ellipse cx="700" cy="400" rx="110" ry="70" fill="url(#smokeGradient)" opacity="0.3"/>
  <ellipse cx="300" cy="400" rx="140" ry="95" fill="url(#smokeGradient)" opacity="0.4"/>
  <ellipse cx="900" cy="350" rx="125" ry="85" fill="url(#smokeGradient)" opacity="0.3"/>
  
  <!-- Additional subtle smoke particles -->
  <circle cx="350" cy="180" r="60" fill="#6366f1" opacity="0.15"/>
  <circle cx="850" cy="220" r="50" fill="#8b5cf6" opacity="0.12"/>
  <circle cx="450" cy="480" r="55" fill="#a78bfa" opacity="0.18"/>
  <circle cx="750" cy="380" r="45" fill="#6366f1" opacity="0.14"/>
  
  <!-- Main Magic Ball -->
  <circle cx="600" cy="315" r="180" fill="url(#ballGradient)" filter="url(#glow)"/>
  
  <!-- Inner shadow/highlight on ball -->
  <ellipse cx="540" cy="270" rx="80" ry="80" fill="#ffffff" opacity="0.05"/>
  <ellipse cx="480" cy="240" rx="60" ry="60" fill="#000000" opacity="0.3"/>
  
  <!-- The number 8 -->
  <text x="600" y="360" font-family="Arial, sans-serif" font-size="180" font-weight="bold" 
        fill="#ffffff" text-anchor="middle" filter="url(#glow)" opacity="0.95">
    8
  </text>
  
  <!-- Additional glow around the ball -->
  <circle cx="600" cy="315" r="200" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.2"/>
  <circle cx="600" cy="315" r="220" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.15"/>
  
  <!-- Title text -->
  <text x="600" y="550" font-family="Arial, sans-serif" font-size="48" font-weight="bold" 
        fill="#ffffff" text-anchor="middle">
    SeerBase
  </text>
  <text x="600" y="590" font-family="Arial, sans-serif" font-size="28" 
        fill="#a0a0a0" text-anchor="middle">
    Ask. Touch. Get an answer.
  </text>
</svg>

