<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:1" />
    </linearGradient>
    
    <!-- Magic ball gradient -->
    <radialGradient id="ballGradient" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#2a2a35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a1f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:1" />
    </radialGradient>
    
    <!-- Mist/Smoke effect filters -->
    <filter id="mist1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
      <feOffset dx="0" dy="0" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="mist2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="25"/>
      <feOffset dx="0" dy="0" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Mystical mist/smoke layers -->
  <ellipse cx="600" cy="315" rx="400" ry="200" fill="rgba(100, 100, 150, 0.15)" filter="url(#mist1)"/>
  <ellipse cx="500" cy="300" rx="350" ry="180" fill="rgba(150, 100, 200, 0.1)" filter="url(#mist2)"/>
  <ellipse cx="700" cy="330" rx="380" ry="190" fill="rgba(100, 150, 200, 0.12)" filter="url(#mist1)"/>
  
  <!-- Magic ball shadow -->
  <ellipse cx="600" cy="450" rx="180" ry="60" fill="rgba(0, 0, 0, 0.4)" opacity="0.6"/>
  
  <!-- Magic ball main sphere -->
  <circle cx="600" cy="315" r="200" fill="url(#ballGradient)" filter="url(#glow)">
    <!-- Inner highlight -->
    <circle cx="540" cy="255" r="60" fill="rgba(255, 255, 255, 0.05)"/>
    <!-- Shadow on ball -->
    <ellipse cx="480" cy="280" rx="80" ry="100" fill="rgba(0, 0, 0, 0.3)"/>
  </circle>
  
  <!-- Ball inner shadow/highlight effect -->
  <ellipse cx="520" cy="270" rx="50" ry="70" fill="rgba(0, 0, 0, 0.4)"/>
  <ellipse cx="560" cy="250" rx="40" ry="50" fill="rgba(255, 255, 255, 0.08)"/>
  
  <!-- Infinity symbol (∞) - horizontal figure-8 -->
  <text x="600" y="360" font-family="Arial, sans-serif" font-size="200" font-weight="700" 
        fill="rgba(255, 255, 255, 0.95)" text-anchor="middle" 
        filter="url(#glow)" style="text-shadow: 0 0 30px rgba(255, 255, 255, 0.5);">
    ∞
  </text>
  
  <!-- Additional mystical particles/glow around ball -->
  <circle cx="450" cy="250" r="8" fill="rgba(150, 150, 255, 0.4)" opacity="0.6"/>
  <circle cx="750" cy="280" r="6" fill="rgba(200, 150, 255, 0.4)" opacity="0.5"/>
  <circle cx="550" cy="400" r="10" fill="rgba(100, 200, 255, 0.3)" opacity="0.4"/>
  <circle cx="650" cy="380" r="7" fill="rgba(255, 200, 150, 0.3)" opacity="0.4"/>
  
  <!-- Title text -->
  <text x="600" y="550" font-family="Arial, sans-serif" font-size="48" font-weight="700" 
        fill="rgba(255, 255, 255, 0.9)" text-anchor="middle">
    SeerBase
  </text>
  <text x="600" y="590" font-family="Arial, sans-serif" font-size="24" 
        fill="rgba(255, 255, 255, 0.6)" text-anchor="middle">
    Ask. Touch. Get an answer.
  </text>
</svg>
