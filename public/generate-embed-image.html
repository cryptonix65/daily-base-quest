<!DOCTYPE html>
<html>
<head>
    <title>Generate Magic Ball Embed Image</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        canvas {
            border: 1px solid #333;
        }
        .instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div class="instructions">
        <h3>Инструкция:</h3>
        <p>1. Правой кнопкой мыши на изображении</p>
        <p>2. Выберите "Сохранить изображение как..."</p>
        <p>3. Сохраните как "magic-ball-embed.png"</p>
    </div>
    <canvas id="canvas" width="1200" height="630"></canvas>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Background gradient
        const bgGradient = ctx.createLinearGradient(0, 0, 1200, 630);
        bgGradient.addColorStop(0, '#0a0a0f');
        bgGradient.addColorStop(0.5, '#1a1a2e');
        bgGradient.addColorStop(1, '#0a0a0f');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, 1200, 630);
        
        // Mystical mist layers
        function drawMist(x, y, rx, ry, opacity) {
            const gradient = ctx.createRadialGradient(x, y, 0, x, y, rx);
            gradient.addColorStop(0, `rgba(100, 100, 150, ${opacity})`);
            gradient.addColorStop(0.5, `rgba(150, 100, 200, ${opacity * 0.5})`);
            gradient.addColorStop(1, `rgba(100, 150, 200, 0)`);
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // Draw mist layers
        drawMist(600, 315, 400, 200, 0.15);
        drawMist(500, 300, 350, 180, 0.1);
        drawMist(700, 330, 380, 190, 0.12);
        
        // Ball shadow
        const shadowGradient = ctx.createRadialGradient(600, 450, 0, 600, 450, 180);
        shadowGradient.addColorStop(0, 'rgba(0, 0, 0, 0.4)');
        shadowGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = shadowGradient;
        ctx.beginPath();
        ctx.ellipse(600, 450, 180, 60, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Magic ball gradient
        const ballGradient = ctx.createRadialGradient(540, 255, 0, 600, 315, 200);
        ballGradient.addColorStop(0, '#2a2a35');
        ballGradient.addColorStop(0.5, '#1a1a1f');
        ballGradient.addColorStop(1, '#0a0a0f');
        
        // Draw ball with glow effect
        ctx.shadowBlur = 30;
        ctx.shadowColor = 'rgba(100, 100, 255, 0.5)';
        ctx.fillStyle = ballGradient;
        ctx.beginPath();
        ctx.arc(600, 315, 200, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // Inner highlight
        ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.beginPath();
        ctx.arc(540, 255, 60, 0, Math.PI * 2);
        ctx.fill();
        
        // Shadow on ball
        const ballShadow = ctx.createRadialGradient(480, 280, 0, 480, 280, 100);
        ballShadow.addColorStop(0, 'rgba(0, 0, 0, 0.3)');
        ballShadow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = ballShadow;
        ctx.beginPath();
        ctx.ellipse(480, 280, 80, 100, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Number 8 with glow
        ctx.shadowBlur = 20;
        ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
        ctx.font = 'bold 180px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('8', 600, 360);
        ctx.shadowBlur = 0;
        
        // Mystical particles
        const particles = [
            {x: 450, y: 250, r: 8, color: 'rgba(150, 150, 255, 0.4)'},
            {x: 750, y: 280, r: 6, color: 'rgba(200, 150, 255, 0.4)'},
            {x: 550, y: 400, r: 10, color: 'rgba(100, 200, 255, 0.3)'},
            {x: 650, y: 380, r: 7, color: 'rgba(255, 200, 150, 0.3)'},
        ];
        
        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
        });
        
        // Title
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.font = 'bold 48px Arial';
        ctx.fillText('SeerBase', 600, 550);
        
        // Subtitle
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.font = '24px Arial';
        ctx.fillText('Ask. Touch. Get an answer.', 600, 590);
    </script>
</body>
</html>
