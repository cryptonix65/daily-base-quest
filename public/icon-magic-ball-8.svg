<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:1" />
    </linearGradient>
    
    <!-- Magic ball gradient -->
    <radialGradient id="ballGradient" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#2a2a35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a1f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:1" />
    </radialGradient>
    
    <!-- Mist/Smoke effect filters -->
    <filter id="mist1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="0" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="mist2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="0" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Glow filter for number 8 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGradient)"/>
  
  <!-- Mystical mist layers (smaller for icon) -->
  <ellipse cx="256" cy="256" rx="180" ry="90" fill="rgba(100, 100, 150, 0.15)" filter="url(#mist1)"/>
  <ellipse cx="220" cy="240" rx="150" ry="75" fill="rgba(150, 100, 200, 0.1)" filter="url(#mist2)"/>
  <ellipse cx="290" cy="260" rx="160" ry="80" fill="rgba(100, 150, 200, 0.12)" filter="url(#mist2)"/>
  
  <!-- Ball shadow -->
  <ellipse cx="256" cy="360" rx="90" ry="30" fill="rgba(0, 0, 0, 0.4)"/>
  
  <!-- Magic ball (centered, scaled for 512x512) -->
  <circle cx="256" cy="256" r="170" fill="url(#ballGradient)"/>
  
  <!-- Inner highlight -->
  <circle cx="230" cy="210" r="30" fill="rgba(255, 255, 255, 0.05)"/>
  
  <!-- Shadow on ball -->
  <ellipse cx="200" cy="220" rx="40" ry="50" fill="rgba(0, 0, 0, 0.3)"/>
  
  <!-- Number 8 with glow (centered) -->
  <text x="256" y="290" font-family="Arial, sans-serif" font-size="140" font-weight="bold" 
        fill="rgba(255, 255, 255, 0.95)" text-anchor="middle" dominant-baseline="middle" 
        filter="url(#glow)">8</text>
  
  <!-- Mystical particles (smaller for icon) -->
  <circle cx="190" cy="200" r="4" fill="rgba(150, 150, 255, 0.4)"/>
  <circle cx="320" cy="220" r="3" fill="rgba(200, 150, 255, 0.4)"/>
  <circle cx="240" cy="320" r="5" fill="rgba(100, 200, 255, 0.3)"/>
  <circle cx="280" cy="300" r="3.5" fill="rgba(255, 200, 150, 0.3)"/>
</svg>


















